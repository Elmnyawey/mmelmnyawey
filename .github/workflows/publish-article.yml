name: Publish bilingual article
run-name: Publish an article to my portfolio

on:
  workflow_dispatch:
    inputs:
      article_json:
        description: "Paste the JSON copied from your private publisher page"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: portfolio-articles
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate English and Arabic articles
        env:
          ARTICLE_JSON: ${{ inputs.article_json }}
        run: node scripts/publish-article.mjs
      - name: Commit and deploy through Cloudflare Pages
        run: |
          git config user.name "Portfolio Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content.json articles.html ar/articles.html sitemap.xml articles/ ar/articles/
          git diff --cached --quiet && { echo "No new article generated"; exit 1; }
          git commit -m "Publish bilingual article"
          git push origin HEAD:main
